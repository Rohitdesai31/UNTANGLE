<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3 L0,6 Z" fill="#212529"/>
    </marker>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #212529; }
      .label { font: 700 18px Arial, sans-serif; fill: #212529; }
      .tag { font: 600 16px Arial, sans-serif; fill: #495057; }
      .small { font: 14px Arial, sans-serif; fill: #6c757d; }
      .equip { fill: #fff; stroke: #212529; stroke-width: 3; }
      .pipe { fill: none; stroke: #212529; stroke-width: 5; marker-end: url(#arrow); }
      .instrument { fill: #fff; stroke: #495057; stroke-width: 2; }
      .signal { fill: none; stroke: #6c757d; stroke-width: 2; stroke-dasharray: 7 6; }
    </style>
  </defs>

  <rect width="1400" height="620" fill="#f8f9fa"/>
  <rect x="25" y="25" width="1350" height="570" rx="12" fill="#fff" stroke="#dee2e6" stroke-width="2"/>

  <text x="60" y="75" class="title">UNTANGLE — Simplified Process Sketch</text>
  <text x="60" y="103" class="small">TK-101 → P-101 → FCV-101 → R-101 → OUTLET</text>

  <!-- Main process flow -->
  <path d="M245 310 H355" class="pipe"/>
  <path d="M485 310 H610" class="pipe"/>
  <path d="M750 310 H875" class="pipe"/>
  <path d="M1050 310 H1190" class="pipe"/>

  <!-- Tank -->
  <path id="SIMPLE-001" d="M105 220 Q105 205 120 205 H225 Q240 205 240 220 V400 Q240 415 225 415 H120 Q105 415 105 400 Z" class="equip"/>
  <path d="M105 260 H240" stroke="#212529" stroke-width="2"/>
  <text x="172" y="345" text-anchor="middle" class="label">TANK</text>
  <text x="172" y="375" text-anchor="middle" class="tag">TK-101</text>

  <!-- Tank level instrument -->
  <circle cx="172" cy="175" r="27" class="instrument"/>
  <text x="172" y="181" text-anchor="middle" class="tag">LT</text>
  <text x="172" y="140" text-anchor="middle" class="tag">LT-101</text>
  <path d="M172 202 V220" class="signal"/>

  <!-- Pump -->
  <circle id="SIMPLE-002" cx="420" cy="310" r="65" class="equip"/>
  <path d="M390 280 L455 310 L390 340 Z" fill="none" stroke="#212529" stroke-width="3"/>
  <text x="420" y="405" text-anchor="middle" class="label">PUMP</text>
  <text x="420" y="430" text-anchor="middle" class="tag">P-101</text>

  <!-- Flow transmitter -->
  <circle cx="550" cy="250" r="28" class="instrument"/>
  <text x="550" y="256" text-anchor="middle" class="tag">FT</text>
  <text x="550" y="215" text-anchor="middle" class="tag">FT-101</text>
  <path d="M550 278 V310" class="signal"/>

  <!-- FIC -->
  <circle cx="680" cy="250" r="28" class="instrument"/>
  <text x="680" y="256" text-anchor="middle" class="tag">FIC</text>
  <text x="680" y="215" text-anchor="middle" class="tag">FIC-101</text>
  <path d="M680 278 V310" class="signal"/>

  <!-- Control valve -->
  <path id="SIMPLE-003" d="M610 310 L645 275 L680 310 L645 345 Z" class="equip"/>
  <path d="M645 275 V250" stroke="#212529" stroke-width="3"/>
  <path d="M620 250 H670" stroke="#212529" stroke-width="3"/>
  <text x="645" y="405" text-anchor="middle" class="label">CONTROL VALVE</text>
  <text x="645" y="430" text-anchor="middle" class="tag">FCV-101</text>

  <!-- Reactor -->
  <path id="SIMPLE-004" d="M875 230 Q875 210 895 210 H1030 Q1050 210 1050 230 V390 Q1050 410 1030 410 H895 Q875 410 875 390 Z" class="equip"/>
  <path d="M875 265 H1050" stroke="#212529" stroke-width="2"/>
  <path d="M900 335 H1025" stroke="#212529" stroke-width="2"/>
  <text x="962" y="330" text-anchor="middle" class="label">REACTOR</text>
  <text x="962" y="365" text-anchor="middle" class="tag">R-101</text>

  <!-- Temperature transmitter -->
  <circle cx="962" cy="175" r="28" class="instrument"/>
  <text x="962" y="181" text-anchor="middle" class="tag">TT</text>
  <text x="962" y="140" text-anchor="middle" class="tag">TT-101</text>
  <path d="M962 203 V230" class="signal"/>

  <!-- Outlet -->
  <path d="M1190 310 H1270" stroke="#212529" stroke-width="5"/>
  <path d="M1270 285 L1320 310 L1270 335 Z" class="equip"/>
  <text x="1255" y="390" text-anchor="middle" class="label">OUTLET</text>
  <text x="1255" y="418" text-anchor="middle" class="tag">OUTLET</text>

  <!-- Legend -->
  <rect x="60" y="500" width="1280" height="65" rx="8" fill="#f8f9fa" stroke="#dee2e6"/>
  <text x="85" y="528" class="small">Solid line = process flow</text>
  <line x1="250" y1="523" x2="330" y2="523" stroke="#212529" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="370" y="528" class="small">Dashed line = instrument association</text>
  <line x1="610" y1="523" x2="690" y2="523" stroke="#6c757d" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="730" y="528" class="small">IO tags preserved from IO List</text>
</svg>
